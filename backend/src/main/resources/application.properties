# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=${SERVER_PORT:8090}

# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/crm_01_apr_2026?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.max-file-size=70MB
spring.servlet.multipart.max-request-size=70MB

# ============================================
# EMAIL CONFIGURATION (SMTP)
# ============================================
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}

# ============================================
# APP CUSTOM CONFIGURATION
# ============================================
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:3001}
app.jwt.secret=${APP_JWT_SECRET:crm-jwt-secret-2026-please-change-in-env-64bytes-minimum-security-key}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}
app.upload.dir=${APP_UPLOAD_DIR:./uploads/}
app.indiamart.api-key=${APP_INDIAMART_API_KEY:}
app.indiamart.url=${APP_INDIAMART_URL:https://mapi.indiamart.com/wservce/crm/crmListing/v2/}

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.com.crm=${LOG_LEVEL_COM_CRM:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SPRING_SECURITY:WARN}